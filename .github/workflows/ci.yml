name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.14.4"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  tests:
    name: Offline tests (parity contracts + repo checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run offline suites
        run: pytest tests -rs

  migration-determinism:
    name: Migration tooling determinism (URS-W0-018 AC-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract every source (run 1)
        # Different hash seeds per run: any dict/set ordering leaking into the canonical
        # file shows up as a diff instead of passing by luck.
        env:
          PYTHONHASHSEED: "0"
        run: python -m rheinwerk_mes.integration.migration.extract --all --output-directory build/run-1
      - name: Extract every source (run 2)
        env:
          PYTHONHASHSEED: "12345"
        run: |
          python -m rheinwerk_mes.integration.migration.extract \
            --all --output-directory build/run-2 --verify-determinism
      - name: Canonical import files are byte-identical
        run: diff -r build/run-1 build/run-2
      - name: Upload canonical import files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W0-canonical-import-files
          path: build/run-1

  contracts:
    name: Characterisation contracts + evidence pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Qcadoo parity contracts (regression floor — W0-6, URS-W0-012)
        run: pytest tests/characterisation -rs
      - name: Wave evidence pack — zero unlinked backlog items (W0-7, URS-W0-013)
        # Regenerates the pack and fails when a backlog item has no URS→TC link.
        # Evidence-incomplete items are reported, not fatal, while sibling waves are in
        # flight; `--strict` (or `--check`) is the wave-exit gate, run by the orchestrator.
        run: python -m tools.evidence.generate --wave W0
      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W0-evidence-pack
          path: docs/evidence/W0-evidence-pack.md

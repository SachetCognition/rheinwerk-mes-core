name: CI

on:
  push:
    branches: [main, migration/in-progress]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.14.4"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  contracts:
    name: Characterisation contracts (regression floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Qcadoo parity contracts (W0-6, URS-W0-012)
        run: pytest tests/characterisation -rs

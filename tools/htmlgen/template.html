<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<style>
:root{--accent:#1f4e79;--accent2:#2e74b5;--bg:#f7f9fb;--card:#ffffff;--text:#24292f;--muted:#6a737d;--border:#e1e6eb;--sidebar-w:300px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.55;font-size:15px}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--accent);color:#fff;overflow-y:auto;padding:22px 18px}
#sidebar .brand{font-size:15px;font-weight:600;letter-spacing:.4px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:12px;margin-bottom:12px}
#sidebar .brand small{display:block;font-weight:400;opacity:.75;margin-top:4px}
#sidebar nav ul{list-style:none;margin:0;padding-left:0}
#sidebar nav ul ul{padding-left:14px}
#sidebar nav a{display:block;color:rgba(255,255,255,.85);text-decoration:none;font-size:12.6px;padding:4px 8px;border-radius:5px;border-left:3px solid transparent}
#sidebar nav a:hover{background:rgba(255,255,255,.12);color:#fff}
#sidebar nav a.active{background:rgba(255,255,255,.18);color:#fff;border-left-color:#9cc3e5;font-weight:600}
#content{margin-left:var(--sidebar-w);padding:42px 56px;max-width:1080px}
header.doc{border-bottom:3px solid var(--accent);padding-bottom:18px;margin-bottom:30px}
header.doc h1{color:var(--accent);font-size:30px;margin:0 0 6px}
header.doc .sub{color:var(--accent2);font-size:15.5px;font-weight:600}
h1,h2{color:var(--accent);margin-top:2.1em;border-bottom:1px solid var(--border);padding-bottom:.25em}
h3,h4{color:var(--accent2);margin-top:1.7em}
a{color:var(--accent2)}
table{border-collapse:collapse;width:100%;margin:1.1em 0;background:var(--card);font-size:13.2px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
th{background:var(--accent);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
td{border:1px solid var(--border);padding:7px 10px;vertical-align:top}
tr:nth-child(even) td{background:#f2f6fa}
code{background:#eef2f6;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px;font-family:Consolas,Menlo,monospace;color:#0b3d66}
pre{background:#0f2a43;color:#dce8f5;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:12.5px}
pre code{background:none;border:none;color:inherit;padding:0}
blockquote{margin:1em 0;padding:10px 16px;background:#eaf1f8;border-left:5px solid var(--accent2);border-radius:0 6px 6px 0;color:#243b53}
img.diagram,p img{max-width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:block;margin:1.2em auto}
#top-btn{position:fixed;right:26px;bottom:26px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:19px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#top-btn.show{opacity:.92;pointer-events:auto}
footer.doc{margin-top:60px;border-top:1px solid var(--border);padding-top:14px;color:var(--muted);font-size:12px}
@media(max-width:900px){#sidebar{display:none}#content{margin-left:0;padding:24px}}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">$doctitle$<small>$subtitle$</small></div>
  <nav>$table-of-contents$</nav>
</aside>
<main id="content">
  <header class="doc"><h1>$doctitle$</h1><div class="sub">$subtitle$</div></header>
$body$
  <footer class="doc">Rheinwerk Chemie GmbH — MES consolidation programme. Generated from the Markdown source of record in SachetCognition/rheinwerk-mes-core.</footer>
</main>
<button id="top-btn" title="Back to top">&#8679;</button>
<script>
const links=[...document.querySelectorAll('#sidebar nav a')];
const targets=links.map(a=>document.getElementById(decodeURIComponent(a.hash.slice(1)))).filter(Boolean);
function onScroll(){
  const y=window.scrollY+90;let cur=targets[0];
  for(const t of targets){if(t.offsetTop<=y)cur=t;else break}
  links.forEach(a=>a.classList.toggle('active',cur&&decodeURIComponent(a.hash.slice(1))===cur.id));
  document.getElementById('top-btn').classList.toggle('show',window.scrollY>500);
}
document.addEventListener('scroll',onScroll,{passive:true});onScroll();
document.getElementById('top-btn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
